<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">
  <title>Computing Attendance Tracker</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

  <style>
    :root {
      --primary: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --present: #e2e8f0;
      --absent: #fee2e2;
      --absent-border: #ef4444;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.35rem;
      color: var(--primary);
    }

    .subject-pill {
      display: inline-block;
      margin-top: 4px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
    }

    .enrolment-badge {
      display: none;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .enrolment-badge span.label-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
    }

    .enrolment-badge span.count-number {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
      background: #e0f2fe;
      padding: 2px 10px;
      border-radius: 9999px;
    }

    .instruction {
      font-size: 0.85rem;
      color: #64748b;
      margin: 12px 0 8px 0;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .student-card {
      background: var(--card-bg);
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .student-card .status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      background: #dcfce7;
      color: #166534;
    }

    .student-card.is-absent {
      background-color: var(--absent);
      border-color: var(--absent-border);
    }

    .student-card.is-absent .status-badge {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn-delete {
      display: none;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .managing .btn-delete {
      display: inline-block;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #475569;
      margin-top: 10px;
      padding: 10px;
      font-size: 0.9rem;
    }

    .manage-box {
      display: none;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .manage-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .manage-input-row input {
      flex: 1;
      padding: 8px;
    }

    .btn-add {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .summary-box {
      margin-top: 16px;
      padding: 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: white;
      font-size: 0.85rem;
    }
  </style>
</head>

    </div>

    <div class="instruction">

    <button class="btn" id="submitBtn" onclick="saveAndSyncAttendance()">Save & Sync to Google Sheets</button>

    });

    function saveRostersLocally() {
      localStorage.setItem('computing_rosters', JSON.stringify(classRosters));
    }

    let absentSet = new Set();
    document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];

    function toggleManageSection() {
      const section = document.getElementById('manageSection');
      const list = document.getElementById('studentList');
      const isOpen = section.style.display === 'block';

      if (isOpen) {
        section.style.display = 'none';
        list.classList.remove('managing');
      } else {
        section.style.display = 'block';
        list.classList.add('managing');
      }
    }

    function addStudent() {
      const selectedClass = document.getElementById('classSelect').value;
      const input = document.getElementById('newStudentName');
      const name = input.value.trim();

      if (!selectedClass) {
        alert("Please select a class first.");
        return;
      }

      if (!name) {
        alert("Please type a student's name.");
        return;
      }

      if (!classRosters[selectedClass]) {
        classRosters[selectedClass] = [];
      }

      if (classRosters[selectedClass].some(s => s.toLowerCase() === name.toLowerCase())) {
        alert("This student is already in the class.");
        return;
      }

      classRosters[selectedClass].push(name);
      classRosters[selectedClass].sort((a, b) => a.localeCompare(b));

      saveRostersLocally();
      input.value = "";
      renderStudents();
    }

    function removeStudent(event, name) {
      event.stopPropagation();
      const selectedClass = document.getElementById('classSelect').value;

      if (!confirm(`Are you sure you want to remove "${name}" from ${selectedClass}?`)) {
        return;
      }

      classRosters[selectedClass] = classRosters[selectedClass].filter(s => s !== name);
      absentSet.delete(name);
      saveRostersLocally();
      renderStudents();
    }

    function renderStudents() {
      const selectedClass = document.getElementById('classSelect').value;
      const container = document.getElementById('attendanceContainer');
      const list = document.getElementById('studentList');
      const summary = document.getElementById('resultSummary');
      const enrolmentBadge = document.getElementById('enrolmentBadge');
      const enrolmentCount = document.getElementById('enrolmentCount');
      const manageSection = document.getElementById('manageSection');

      summary.style.display = 'none';
      absentSet.clear();

      if (!selectedClass) {
        container.style.display = 'none';
        enrolmentBadge.style.display = 'none';
        manageSection.style.display = 'none';
        list.classList.remove('managing');
        return;
      }

      const students = classRosters[selectedClass] || [];

      enrolmentCount.innerText = students.length;
      enrolmentBadge.style.display = 'flex';

      container.style.display = 'block';
      list.innerHTML = '';

      students.forEach((name, index) => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `student-${index}`;
        card.innerHTML = `
          <span>${name}</span>
          <div class="card-actions">
            <span class="status-badge" id="badge-${index}">PRESENT</span>
            <button type="button" class="btn-delete" onclick="removeStudent(event, '${name.replace(/'/g, "\\'")}')">✕</button>
          </div>
        `;
        card.onclick = () => toggleAbsent(index, name);
        list.appendChild(card);
      });
    }

    function toggleAbsent(index, name) {
      const card = document.getElementById(`student-${index}`);
      const badge = document.getElementById(`badge-${index}`);

      if (absentSet.has(name)) {
        absentSet.delete(name);
        card.classList.remove('is-absent');
        badge.innerText = 'PRESENT';
      } else {
        absentSet.add(name);
        card.classList.add('is-absent');
        badge.innerText = 'ABSENT';
      }
    }

    async function saveAndSyncAttendance() {
      const selectedClass = document.getElementById('classSelect').value;
      const selectedDate = document.getElementById('datePicker').value;
      const totalStudents = classRosters[selectedClass].length;
      const absentStudents = Array.from(absentSet);
      const presentCount = totalStudents - absentStudents.length;
      const submitBtn = document.getElementById('submitBtn');
      const summary = document.getElementById('resultSummary');

      const payload = {
        subject: "Computing",
        class: selectedClass,
        date: selectedDate,
        total: totalStudents,
        presentCount: presentCount,
        absentCount: absentStudents.length,
        absentList: absentStudents
      };

      const storageKey = `attendance_Computing_${selectedClass}_${selectedDate}`;
      localStorage.setItem(storageKey, JSON.stringify(payload));

      submitBtn.disabled = true;
      submitBtn.innerText = "Syncing to Google Sheets...";
      summary.style.display = 'block';
      summary.innerHTML = `Recording locally and syncing online...`;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        summary.innerHTML = `
          <strong style="color: #166534;">✅ Saved & Synced Successfully!</strong><br>
          <strong>Subject:</strong> Computing<br>
          <strong>Class:</strong> ${selectedClass} (${selectedDate})<br>
          • Present: ${presentCount} / ${totalStudents}<br>
          • Absent (${absentStudents.length}): ${absentStudents.length > 0 ? absentStudents.join(', ') : 'None'}
        `;
      } catch (err) {
        summary.innerHTML = `
          <strong style="color: #ca8a04;">⚠️ Saved locally, but failed to sync online.</strong><br>
          Check internet connection or the Script URL.
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Save & Sync to Google Sheets";
      }
    }
  </script>
</body>
